services:
  - type: web
    name: codex-vitae-saas
    env: python
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: codex-vitae-db
          property: connectionString
      - key: DEFAULT_LLM_MODEL
        value: "groq/llama-3.3-70b-versatile"
      - key: DOMAIN_URL
        value: "https://codex-vitae-saas.onrender.com"

databases:
  - name: codex-vitae-db
    databaseName: codex_vitae
    user: codex_user
    plan: free
