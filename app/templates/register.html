{% extends "base.html" %}

{% block title %}Criar Conta — Codex Vitae SaaS{% endblock %}

{% block content %}
<div class="py-20 flex items-center justify-center min-h-[calc(100vh-160px)] relative overflow-hidden bg-gradient-glow">
    <div class="max-w-md w-full px-4">
        <div class="glass-panel p-8 rounded-3xl border border-slate-800 shadow-2xl relative z-10">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-2xl bg-brand-500/20 border border-brand-500/30 text-brand-400 flex items-center justify-center text-xl mx-auto mb-4">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1 class="font-heading font-extrabold text-2xl text-white">Criar Sua Conta</h1>
                <p class="text-slate-400 text-xs mt-1">Desbloqueie os 6 Módulos do Codex Vitae hoje mesmo.</p>
            </div>

            <!-- Error Notification -->
            <div id="error-alert" class="hidden mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold"></div>

            <!-- Form -->
            <form id="register-form" class="space-y-4" onsubmit="handleRegister(event)">
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Nome Completo</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-user text-sm"></i>
                        </span>
                        <input type="text" id="full_name" required placeholder="Seu Nome" class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition-colors text-sm font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">E-mail</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-envelope text-sm"></i>
                        </span>
                        <input type="email" id="email" required placeholder="seu@email.com" class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition-colors text-sm font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Senha</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </span>
                        <input type="password" id="password" minlength="6" required placeholder="Mínimo 6 caracteres" class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition-colors text-sm font-medium">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-brand-500 to-cyan-500 text-dark-base font-extrabold text-sm shadow-lg shadow-brand-500/25 hover:shadow-brand-500/40 hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-2 mt-4">
                    Cadastrar e Iniciar
                </button>
            </form>

            <!-- Footer Link -->
            <div class="mt-8 pt-6 border-t border-slate-800/80 text-center text-xs text-slate-400">
                Já possui uma conta? 
                <a href="/login" class="text-brand-400 font-bold hover:underline">Fazer Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
async function handleRegister(e) {
    e.preventDefault();
    const alert = document.getElementById('error-alert');
    const btn = document.getElementById('submit-btn');
    alert.classList.add('hidden');

    const full_name = document.getElementById('full_name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Criando conta...';

    try {
        const response = await fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ full_name, email, password })
        });
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || 'Erro ao realizar cadastro.');
        }

        window.location.href = '/dashboard';
    } catch (err) {
        alert.innerText = err.message;
        alert.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = 'Cadastrar e Iniciar';
    }
}
</script>
{% endblock %}
